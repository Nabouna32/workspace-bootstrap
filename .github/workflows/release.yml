name: Release Windows package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: workspace-bootstrap-release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    name: Build and package Windows release
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.401

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore src/WorkspaceControl.Infrastructure/WorkspaceControl.Infrastructure.csproj
          dotnet restore src/WorkspaceControl.Desktop/WorkspaceControl.Desktop.csproj --runtime win-x64
          dotnet restore src/WorkspaceBootstrap.Cli/WorkspaceBootstrap.Cli.csproj --runtime win-x64
          dotnet restore tests/WorkspaceBootstrap.Tests/WorkspaceBootstrap.Tests.csproj

      - name: Build and test
        shell: pwsh
        run: |
          dotnet build src/WorkspaceControl.Infrastructure/WorkspaceControl.Infrastructure.csproj --configuration Release --no-restore --warnaserror
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          if (-not $msbuild) { throw "Visual Studio MSBuild could not be located." }
          & $msbuild src/WorkspaceControl.Desktop/WorkspaceControl.Desktop.csproj /t:Build /p:Configuration=Release /p:Platform=x64 /warnAsError
          if ($LASTEXITCODE -ne 0) { throw "WinUI desktop build failed with exit code $LASTEXITCODE." }
          dotnet build src/WorkspaceBootstrap.Cli/WorkspaceBootstrap.Cli.csproj --configuration Release --no-restore --warnaserror
          dotnet test tests/WorkspaceBootstrap.Tests/WorkspaceBootstrap.Tests.csproj --configuration Release --no-restore --logger "trx;LogFileName=tests-Release.trx"
          dotnet format tests/WorkspaceBootstrap.Tests/WorkspaceBootstrap.Tests.csproj --no-restore --verify-no-changes

      - name: Publish portable package
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP "workspace-bootstrap-release"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          if (-not $msbuild) { throw "Visual Studio MSBuild could not be located." }
          & $msbuild src/WorkspaceControl.Desktop/WorkspaceControl.Desktop.csproj /restore /t:Publish /p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifier=win-x64 /p:SelfContained=true /p:PublishDir="$package\WorkspaceControl\"
          if ($LASTEXITCODE -ne 0) { throw "Workspace Control publish failed with exit code $LASTEXITCODE." }
          dotnet publish src/WorkspaceBootstrap.Cli/WorkspaceBootstrap.Cli.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore --output $package

      - name: Smoke-test package
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP "workspace-bootstrap-release"
          $winUiDesktop = Join-Path $package "WorkspaceControl/WorkspaceControl.exe"
          $cli = Join-Path $package "WorkspaceBootstrap.Cli.exe"
          $catalog = Join-Path $package "bootstrap/windows/components/catalog.json"
          $profiles = Join-Path $package "bootstrap/windows/profiles"
          $readme = Join-Path $package "README.md"
          $license = Join-Path $package "LICENSE"
          Copy-Item README.md $readme -Force
          Copy-Item LICENSE $license -Force

          if (-not (Test-Path $winUiDesktop)) { throw "Workspace Control WinUI executable is missing: $winUiDesktop" }
          if (-not (Test-Path $cli)) { throw "CLI executable is missing: $cli" }
          if (-not (Test-Path $catalog)) { throw "Bundled component catalog is missing: $catalog" }
          if (-not (Test-Path $profiles -PathType Container)) { throw "Bundled profiles directory is missing: $profiles" }
          if (-not (Test-Path $readme)) { throw "Portable package README is missing: $readme" }
          if (-not (Test-Path $license)) { throw "Portable package LICENSE is missing: $license" }

          & $cli capabilities
          if ($LASTEXITCODE -ne 0) { throw "Portable CLI smoke test failed with exit code $LASTEXITCODE." }

          Write-Host "Launching published WinUI desktop application..."
          & .\\scripts\\validate-published-package.ps1 -PackageRoot $package

      - name: Create checksum
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP "workspace-bootstrap-release"
          $zip = Join-Path $env:RUNNER_TEMP "WorkspaceControl-win-x64.zip"
          Compress-Archive -Path (Join-Path $package '*') -DestinationPath $zip -Force
          $hash = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash
          "$hash  WorkspaceControl-win-x64.zip" | Set-Content -Encoding ascii (Join-Path $env:RUNNER_TEMP "SHA256SUMS.txt")

      - name: Upload release package
        uses: actions/upload-artifact@v6
        with:
          name: workspace-control-win-x64-${{ github.ref_name }}
          path: |
            ${{ runner.temp }}/WorkspaceControl-win-x64.zip
            ${{ runner.temp }}/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create GitHub release for tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "${{ runner.temp }}/WorkspaceControl-win-x64.zip" "${{ runner.temp }}/SHA256SUMS.txt" --generate-notes
