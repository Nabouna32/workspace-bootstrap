name: Repository validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Restore, build, test and publish
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show toolchain
        shell: cmd
        run: |
          dotnet --info
          git --version

      - name: Restore
        shell: cmd
        run: |
          dotnet restore tests/WorkspaceBootstrap.Tests/WorkspaceBootstrap.Tests.csproj
          dotnet restore desktop/WorkspaceBootstrap.Desktop.csproj
          dotnet restore src/WorkspaceBootstrap.Cli/WorkspaceBootstrap.Cli.csproj

      - name: Build engine
        run: dotnet build src/WorkspaceBootstrap.Engine/WorkspaceBootstrap.Engine.csproj --configuration Release --no-restore

      - name: Build desktop
        run: dotnet build desktop/WorkspaceBootstrap.Desktop.csproj --configuration Release --no-restore

      - name: Build CLI
        run: dotnet build src/WorkspaceBootstrap.Cli/WorkspaceBootstrap.Cli.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/WorkspaceBootstrap.Tests/WorkspaceBootstrap.Tests.csproj --configuration Release --no-restore --logger "trx;LogFileName=tests.trx"

      - name: Publish self-contained CLI
        run: dotnet publish src/WorkspaceBootstrap.Cli/WorkspaceBootstrap.Cli.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore --output artifacts/cli

      - name: Verify publish output
        shell: cmd
        run: |
          if not exist artifacts\cli\WorkspaceBootstrap.exe exit /b 1

      - name: Upload validation artifacts
        uses: actions/upload-artifact@v6
        with:
          name: workspace-bootstrap-validation-${{ github.run_id }}
          path: |
            artifacts/cli/**
            **/TestResults/*.trx
          if-no-files-found: error

